services:
  app:
    build: .
    container_name: backendwaketv-app
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: backendwaketv-nginx
    depends_on:
      - app
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
